name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Third-party actions are pinned to a commit SHA (see CONTRIBUTING.md
    # "GitHub Actions pinning"). Tracking @master made this gate change without
    # any repository change: it started failing when ShellCheck 0.11 was
    # auto-installed by the action's default 'stable' version.
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
      with:
        severity: warning
        check_together: 'yes'
        # Pin the ShellCheck release as well — 'stable' silently upgrades the
        # linter (and its findings) between runs.
        version: v0.11.0
      env:
        SHELLCHECK_OPTS: -e SC1090 -e SC1091

  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Check telemon.sh syntax
      run: bash -n telemon.sh
    
    - name: Check install.sh syntax
      run: bash -n install.sh
    
    - name: Check uninstall.sh syntax
      run: bash -n uninstall.sh
    
    - name: Check update.sh syntax
      run: bash -n update.sh
    
    - name: Check telemon-admin.sh syntax
      run: bash -n telemon-admin.sh
    
    - name: Check lib/common.sh syntax
      run: bash -n lib/common.sh

  test-run:
    name: Test Run (Dry Mode)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Create test .env
      run: |
        cp .env.example .env
        # Use dummy values for testing
        sed -i 's/your-bot-token-here/test-token/' .env
        sed -i 's/your-chat-id-here/123456789/' .env
    
    - name: Validate configuration
      run: |
        bash telemon-admin.sh validate
      continue-on-error: true
    
    - name: Run test suite
      run: |
        bash tests/run_tests.sh
    
    - name: Check script structure
      run: |
        # Verify all required functions exist
        grep -q "check_cpu()" telemon.sh || exit 1
        grep -q "check_memory()" telemon.sh || exit 1
        grep -q "check_disk()" telemon.sh || exit 1
        grep -q "send_telegram()" telemon.sh || exit 1
        # portable_stat lives in lib/common.sh (moved there in the 2026-08-16 audit)
        grep -q "portable_stat()" lib/common.sh || exit 1
        echo "All required functions found"

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Run markdownlint
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      with:
        globs: '**/*.md'
        config: '.markdownlint-cli2.jsonc'
      continue-on-error: true
