name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Third-party actions are pinned to a commit SHA (see CONTRIBUTING.md
    # "GitHub Actions pinning"). Tracking @master made this gate change without
    # any repository change: it started failing when ShellCheck 0.11 was
    # auto-installed by the action's default 'stable' version.
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
      with:
        severity: warning
        check_together: 'yes'
        # Pin the ShellCheck release as well — 'stable' silently upgrades the
        # linter (and its findings) between runs.
        version: v0.11.0
      env:
        SHELLCHECK_OPTS: -e SC1090 -e SC1091

  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Check telemon.sh syntax
      run: bash -n telemon.sh
    
    - name: Check install.sh syntax
      run: bash -n install.sh
    
    - name: Check uninstall.sh syntax
      run: bash -n uninstall.sh
    
    - name: Check update.sh syntax
      run: bash -n update.sh
    
    - name: Check telemon-admin.sh syntax
      run: bash -n telemon-admin.sh
    
    - name: Check lib/common.sh syntax
      run: bash -n lib/common.sh

  test-run:
    name: Test Run (Dry Mode)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Create test .env
      run: |
        cp .env.example .env
        # Use dummy values for testing
        sed -i 's/your-bot-token-here/test-token/' .env
        sed -i 's/your-chat-id-here/123456789/' .env
    
    - name: Validate configuration
      run: |
        bash telemon-admin.sh validate
      continue-on-error: true
    
    - name: Run test suite
      run: |
        bash tests/run_tests.sh
    
    - name: Check script structure
      run: |
        # Verify all required functions exist
        grep -q "check_cpu()" telemon.sh || exit 1
        grep -q "check_memory()" telemon.sh || exit 1
        grep -q "check_disk()" telemon.sh || exit 1
        grep -q "send_telegram()" telemon.sh || exit 1
        # portable_stat lives in lib/common.sh (moved there in the 2026-08-16 audit)
        grep -q "portable_stat()" lib/common.sh || exit 1
        echo "All required functions found"

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # This gate is enforced: .markdownlint-cli2.jsonc disables only the rules
    # that conflict with the intentional dense-docs style, and the docs are
    # lint-clean. It previously ran with `continue-on-error: true`, so a failing
    # job still reported success and lint regressions could not be caught.
    - name: Run markdownlint
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      with:
        globs: '**/*.md'
        config: '.markdownlint-cli2.jsonc'

  artifact-check:
    name: Release Artifact Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # The release workflow publishes the archive built by this script. Packaging
    # used to be an inline `cp` list that omitted lib/common.sh, so every
    # published archive was non-runnable (GH #21). Build it on every push/PR and
    # prove the result is complete and can actually start.
    - name: Build release archive
      run: bash scripts/build-release-archive.sh v0.0.0-ci /tmp/artifact

    - name: Verify archive contents
      run: |
        set -euo pipefail
        ls -l /tmp/artifact
        test -f /tmp/artifact/telemon-v0.0.0-ci.tar.gz
        test -f /tmp/artifact/telemon-v0.0.0-ci.zip
        # List once, then grep the list: `tar tzf … | grep -q` returns 141
        # under `set -o pipefail` (grep exits early, tar gets SIGPIPE)
        tar tzf /tmp/artifact/telemon-v0.0.0-ci.tar.gz > /tmp/archive.list
        for f in telemon.sh telemon-admin.sh lib/common.sh VERSION \
                 checks.d/example-plugin.sh systemd/telemon.timer; do
          grep -qx "telemon-v0.0.0-ci/${f}" /tmp/archive.list \
            || { echo "MISSING from archive: ${f}"; exit 1; }
        done
        echo "All required files present in the archive"

    - name: Smoke-test the extracted archive
      run: |
        set -euo pipefail
        mkdir -p /tmp/extract
        tar xzf /tmp/artifact/telemon-v0.0.0-ci.tar.gz -C /tmp/extract
        cd /tmp/extract/telemon-v0.0.0-ci
        cp .env.example .env
        # Exercises the lib/common.sh load path (the file whose absence broke
        # every published archive) plus the CLI entry point
        bash telemon.sh --help > /dev/null
        # A full validation pass must actually run, not die at startup
        bash telemon.sh --validate > /tmp/validate.out 2>&1 || true
        grep -q "Checks enabled" /tmp/validate.out
        ! grep -q "FATAL: lib/common.sh" /tmp/validate.out
        echo "Extracted archive starts and validates"
