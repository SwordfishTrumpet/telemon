name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    # Packaging lives in scripts/build-release-archive.sh — single source of
    # truth, also built and smoke-tested by the CI "Release Artifact Check"
    # job. (An inline `cp` list used to omit lib/common.sh, so every published
    # archive was non-runnable; GH #21.)
    - name: Build release archive
      run: bash scripts/build-release-archive.sh "${GITHUB_REF#refs/tags/}"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          telemon-*.tar.gz
          telemon-*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
