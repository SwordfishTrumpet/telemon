version: '3.8'

# ══════════════════════════════════════════════════════════════════════════════
# Telemon — LXC Monitoring
# ══════════════════════════════════════════════════════════════════════════════
#
# Telemon runs as a host cron job (not in Docker):
#   /etc/cron.d/telemon  →  */5 * * * * root bash telemon.sh
#
# This compose file is preserved for reference only — the Docker deployment
# is deprecated. Using host cron avoids:
#   - Mounting /var/run/docker.sock (privilege escalation vector)
#   - Running a scheduler container with Docker API access
#   - Additional Docker daemon overhead inside an LXC
#
# ══════════════════════════════════════════════════════════════════════════════

services:
  # Reference only — not deployed.
  # Telemon runs directly via host cron in /etc/cron.d/telemon.
  telemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemon
    restart: unless-stopped
    volumes:
      - ./.env:/opt/telemon/.env:ro
      - telemon-state:/var/lib/telemon
      - telemon-logs:/var/log/telemon
      - /proc:/host/proc:ro
    environment:
      - STATE_FILE=/var/lib/telemon/state
      - LOG_FILE=/var/log/telemon/telemon.log
      - HOST_PROC=/host/proc
    command: >
      sh -c '
        while true; do
          bash /opt/telemon/telemon.sh || true;
          sleep 300;
        done
      '

volumes:
  telemon-state:
  telemon-logs:
